<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Bán Nắp Bể Inox</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

/* HEADER */
.header {
    background: #c40000;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

/* TABS */
.tabs {
    display: flex;
    background: #e60000;
    padding: 10px;
    justify-content: center;
}
.tabs button {
    background: white;
    border: none;
    margin: 5px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: bold;
}

/* PRODUCT GRID */
.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    padding: 20px;
}

.product {
    background: white;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    position: relative;
    transition: 0.3s;
}
.product:hover {
    transform: scale(1.05);
}

.product img {
    width: 100%;
}

.discount {
    position: absolute;
    top: 10px;
    right: 10px;
    background: red;
    color: white;
    padding: 5px;
    border-radius: 50%;
}

.price {
    color: red;
    font-weight: bold;
}
.old-price {
    text-decoration: line-through;
    color: gray;
}

.buy-btn {
    margin-top: 10px;
    background: orange;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

/* FOOTER TOP */
.footer-top {
    background: #c40000;
    color: white;
    display: flex;
    justify-content: space-around;
    padding: 15px;
    font-weight: bold;
}

/* FOOTER */
.footer {
    background: #eee;
    padding: 30px;
}

.footer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.footer h4 {
    color: #0b4aa2;
}

.map iframe {
    width: 100%;
    height: 200px;
    border: 0;
}
</style>
</head>

<body>

<div class="header">NẮP BỂ INOX VIỆT ANH</div>

<div class="tabs">
    <button onclick="filter('all')">Tất cả</button>
    <button onclick="filter('500')">500KG</button>
    <button onclick="filter('2000')">2000KG</button>
</div>

<div class="product-grid" id="products"></div>

<!-- FOOTER -->
<div class="footer-top">
    <div>📞 HOTLINE: 0977.992.456</div>
    <div>📞 CSKH: 0968.225.675</div>
    <div>📞 KHIẾU NẠI: 0968.225.675</div>
</div>

<div class="footer">
    <div class="footer-grid">
        <div>
            <h4>Thông tin</h4>
            <p>Giới thiệu</p>
            <p>Liên hệ</p>
        </div>

        <div>
            <h4>Hỗ trợ</h4>
            <p>Bảo hành</p>
            <p>Giao hàng</p>
        </div>

        <div class="map">
            <h4>Bản đồ</h4>
            <iframe src="https://maps.google.com/maps?q=Hà Nội&output=embed"></iframe>
        </div>
    </div>
</div>

<script>
const data = [
    {name:'Nắp 400x400', price:1300000, old:1700000, type:'500'},
    {name:'Nắp 500x500', price:1500000, old:2000000, type:'500'},
    {name:'Nắp 600x600', price:1700000, old:2200000, type:'2000'},
    {name:'Nắp 700x700', price:2000000, old:2600000, type:'2000'}
];

function render(list){
    const html = list.map(p=>`
    <div class="product">
        <div class="discount">-25%</div>
        <img src="https://via.placeholder.com/200">
        <p>${p.name}</p>
        <div class="price">${p.price.toLocaleString()}đ</div>
        <div class="old-price">${p.old.toLocaleString()}đ</div>
        <button class="buy-btn">MUA NGAY</button>
    </div>
    `).join('');

    document.getElementById('products').innerHTML = html;
}

function filter(type){
    if(type==='all') return render(data);
    render(data.filter(p=>p.type===type));
}

render(data);
</script>

</body>
</html>
