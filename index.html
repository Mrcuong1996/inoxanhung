<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inox An Hưng | Gia Công Inox Thanh Hóa</title>

<meta name="description" content="Gia công inox Thanh Hóa: nắp bể inox, lan can inox, cầu thang inox, máng xối inox. Giá xưởng, uy tín.">
<meta name="robots" content="index, follow">

<link rel="icon" href="logo.png">

<style>

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
background:#111;
color:#fff;
padding-top:85px;
overflow-x:hidden;
}

.container{width:95%;max-width:1200px;margin:auto;}

/* ================= HEADER ================= */
header{
position:fixed;
top:0;left:0;
width:100%;
background:#000;
border-bottom:1px solid #d4af37;
z-index:999;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
}

.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo img{height:42px;}
.logo h1{font-size:18px;color:#d4af37;}

.hotline{
background:#d4af37;
color:#111;
padding:8px 14px;
border-radius:20px;
font-weight:bold;
text-decoration:none;
}

/* ================= HERO ================= */
.hero{
height:85vh;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url('BANNER.jpg');
background-size:cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h2{
font-size:36px;
color:#d4af37;
}

.hero p{margin:15px 0;color:#ddd;}

.btn{
display:inline-block;
padding:12px 18px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
margin:5px;
}

.btn-gold{background:#d4af37;color:#111;}
.btn-outline{border:2px solid #d4af37;color:#d4af37;}

/* ================= SECTION ================= */
section{padding:60px 0;}

.section-title{text-align:center;margin-bottom:30px;}
.section-title h2{color:#d4af37;}

/* ================= PRODUCTS ================= */
.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:15px;
}

.product{
background:#1a1a1a;
border-radius:10px;
overflow:hidden;
transition:.3s;
}

.product:hover{transform:translateY(-4px);}

.product img{width:100%;height:180px;object-fit:cover;}

.product-content{text-align:center;padding:10px;}

.price{color:#d4af37;font-weight:bold;}

.buy-btn{
display:inline-block;
margin-top:10px;
background:#d4af37;
color:#111;
padding:8px 15px;
border-radius:20px;
text-decoration:none;
}

/* ================= FLOAT ICON (GIỮ MARKETING NHẸ) ================= */
.contact-float{
position:fixed;
right:15px;
bottom:70px;
display:flex;
flex-direction:column;
gap:10px;
z-index:9999;
}

.cf-item{
width:50px;height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:18px;
text-decoration:none;
animation:shake 2s infinite;
position:relative;
}

.phone{background:#e74c3c;}
.zalo{background:#0084ff;}
.mess{background:#1877f2;}

@keyframes shake{
0%{transform:rotate(0);}
25%{transform:rotate(3deg);}
50%{transform:rotate(0);}
75%{transform:rotate(-3deg);}
100%{transform:rotate(0);}
}

.pulse{
position:absolute;
width:100%;height:100%;
border-radius:50%;
background:inherit;
animation:pulse 2s infinite;
z-index:-1;
}

@keyframes pulse{
0%{transform:scale(1);opacity:.6;}
100%{transform:scale(2.3);opacity:0;}
}

/* ================= FORM ================= */
.form-box{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

input,textarea{
width:100%;
padding:10px;
margin-bottom:10px;
border:1px solid #333;
background:#000;
color:#fff;
}

/* ================= POPUP (NHẸ, KHÔNG GÂY LOẠN) ================= */
.popup{
position:fixed;
bottom:100px;
left:15px;
background:#d4af37;
color:#111;
padding:12px 15px;
border-radius:10px;
font-weight:bold;
display:none;
z-index:9999;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
.hero h2{font-size:26px;}
.form-box{grid-template-columns:1fr;}
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
<div class="container navbar">

<a href="./" class="logo">
<img src="logo.png">
<h1>INOX AN HƯNG</h1>
</a>

<a href="tel:0976036631" class="hotline">📞 Gọi ngay</a>

</div>
</header>

<!-- HERO -->
<section class="hero">
<div>
<h2>GIA CÔNG INOX THANH HÓA</h2>
<p>Nắp bể - Lan can - Cầu thang - Máng xối</p>

<a href="tel:0976036631" class="btn btn-gold">GỌI NGAY</a>
<a href="#baogia" class="btn btn-outline">BÁO GIÁ</a>
</div>
</section>

<!-- PRODUCTS -->
<section id="sanpham">
<div class="container">

<div class="section-title">
<h2>SẢN PHẨM</h2>
</div>

<div class="product-grid" id="products"></div>

</div>
</section>

<!-- FORM -->
<section id="baogia">
<div class="container">

<div class="section-title">
<h2>NHẬN BÁO GIÁ</h2>
</div>

<div class="form-box">

<div>
<p>📞 0976036631</p>
<p>📍 Thanh Hóa</p>
</div>

<div>
<input placeholder="Họ tên">
<input placeholder="SĐT">
<textarea placeholder="Nội dung"></textarea>
<button class="buy-btn">GỬI YÊU CẦU</button>
</div>

</div>

</div>
</section>

<!-- FLOAT ICON -->
<div class="contact-float">

<a href="tel:0976036631" class="cf-item phone">
📞<span class="pulse"></span>
</a>

<a href="https://zalo.me/4076776927681495659" class="cf-item zalo">
Z<span class="pulse"></span>
</a>

<a href="https://www.facebook.com/inoxanhungthanhhoa/" class="cf-item mess">
M<span class="pulse"></span>
</a>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
🔥 Gọi ngay để nhận báo giá tốt nhất
</div>

<script>

const products=[
{name:"Nắp bể inox 500x500",price:1200000,img:"500.png"},
{name:"Lan can inox",price:0,img:"11.jpg"},
{name:"Cầu thang inox",price:0,img:"12.jpg"}
];

let html="";

products.forEach(p=>{
html+=`
<div class="product">
<img src="${p.img}">
<div class="product-content">
<h3>${p.name}</h3>
<div class="price">${p.price? p.price.toLocaleString()+"đ":"Liên hệ"}</div>
<a href="tel:0976036631" class="buy-btn">GỌI NGAY</a>
</div>
</div>
`;
});

document.getElementById("products").innerHTML=html;

/* popup nhẹ */
setTimeout(()=>{
document.getElementById("popup").style.display="block";
},3000);

setTimeout(()=>{
document.getElementById("popup").style.display="none";
},8000);

</script>

</body>
</html>
