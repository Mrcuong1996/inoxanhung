<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOX AN HƯNG</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f5f5f5;
}

/* HEADER */
header{
    background:#d40000;
    color:#fff;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

/* MENU */
.menu{
    display:flex;
    justify-content:center;
    gap:10px;
    background:#fff;
    padding:10px;
}
.menu button{
    background:#d40000;
    color:#fff;
    border:none;
    padding:10px 15px;
    cursor:pointer;
}

/* BANNER */
.banner img{
    width:100%;
    max-height:350px;
    object-fit:cover;
}

/* PRODUCT */
.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.product{
    background:#fff;
    padding:10px;
    border-radius:8px;
    position:relative;
    text-align:center;
    transition:0.3s;
}
.product:hover{
    transform:translateY(-5px);
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.product img{
    width:100%;
    height:180px;
    object-fit:cover;
}

/* DISCOUNT */
.discount{
    position:absolute;
    top:10px;
    right:10px;
    background:red;
    color:#fff;
    padding:5px;
    border-radius:50%;
}

/* PRICE */
.price{
    color:red;
    font-weight:bold;
    font-size:18px;
}
.old{
    text-decoration:line-through;
    color:#999;
}

/* BUTTON CALL */
.buy-btn{
    display:block;
    margin-top:10px;
    background:red;
    color:#fff;
    padding:10px;
    text-decoration:none;
    border-radius:5px;
    animation:shake 1s infinite;
}

/* RUNG */
@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-2px)}
    50%{transform:translateX(2px)}
    75%{transform:translateX(-2px)}
    100%{transform:translateX(0)}
}

/* FLOAT BUTTON */
.call{
    position:fixed;
    bottom:20px;
    left:20px;
    background:red;
    color:#fff;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    text-decoration:none;
    animation:ring 1s infinite;
}

@keyframes ring{
    0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}
    70%{box-shadow:0 0 0 20px rgba(255,0,0,0)}
}

/* FOOTER */
footer{
    background:#222;
    color:#fff;
    padding:20px;
    margin-top:40px;
}
footer .wrap{
    max-width:1200px;
    margin:auto;
}
iframe{
    width:100%;
    height:250px;
    border:none;
    margin-top:10px;
}
</style>

</head>
<body>

<header>
CÔNG TY CP TM & SX AN HƯNG - INOX AN HƯNG
<br>📞 0976036631
</header>

<div class="menu">
<button onclick="filter('all')">Tất cả</button>
<button onclick="filter('500')">500kg</button>
<button onclick="filter('1000')">1000kg</button>
<button onclick="filter('2000')">2000kg</button>
</div>

<div class="banner">
<img src="BANNER.jpg">
</div>

<div class="container">
<div class="products" id="products"></div>
</div>

<a href="tel:0976036631" class="call">📞</a>

<footer>
<div class="wrap">
<h3>INOX AN HƯNG - GIA CÔNG THEO YÊU CẦU</h3>
<p>📍 Lô 10 KCN Tây Bắc Ga - Đông Thọ - TP Thanh Hóa</p>
<p>📞 0976036631</p>

<iframe src="https://www.google.com/maps?q=19.8216857,105.7604043&hl=vi&z=17&output=embed"></iframe>
</div>
</footer>

<script>

const data=[
{name:'Nắp bể 500x500',img:'2.jpg',price:1500000,old:2000000,type:'500'},
{name:'Nắp bể 600x600',img:'3.jpg',price:1700000,old:2200000,type:'1000'},
{name:'Nắp bể 700x700',img:'4.jpg',price:2000000,old:2600000,type:'2000'},
{name:'Nắp bể 800x800',img:'5.jpg',price:2300000,old:3000000,type:'2000'},
{name:'Nắp bể 900x900',img:'6.jpg',price:2600000,old:3400000,type:'2000'},
{name:'Nắp bể 1000x1000',img:'7.jpg',price:3000000,old:3800000,type:'2000'}
];

function render(list){
const html=list.map(p=>`
<div class="product">
<div class="discount">-25%</div>
<img src="${p.img}">
<p>${p.name}</p>
<div class="price">${p.price.toLocaleString()}đ</div>
<div class="old">${p.old.toLocaleString()}đ</div>

<a href="tel:0976036631" class="buy-btn">📞 GỌI NGAY</a>

</div>
`).join('');

document.getElementById('products').innerHTML=html;
}

function filter(type){
if(type==='all') return render(data);
render(data.filter(p=>p.type===type));
}

render(data);

</script>

</body>
</html>
