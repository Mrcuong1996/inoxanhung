<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INOX AN HƯNG</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

/* HEADER */
.header{
    background:#b30000;
    color:#fff;
    padding:15px;
    text-align:center;
}
.header h1{
    margin:0;
    font-size:22px;
}
.header p{
    margin:5px 0 0;
}

/* SLIDER */
.slider{
    position:relative;
    overflow:hidden;
    height:320px;
}
.slides{
    display:flex;
    width:300%;
    animation:slide 12s infinite;
}
.slides img{
    width:100%;
    object-fit:cover;
}
@keyframes slide{
    0%{margin-left:0;}
    33%{margin-left:-100%;}
    66%{margin-left:-200%;}
    100%{margin-left:0;}
}

/* CTA */
.cta{
    position:absolute;
    bottom:20px;
    left:20px;
}
.cta a{
    background:orange;
    color:#fff;
    padding:10px 15px;
    margin-right:10px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

/* FEATURES */
.features{
    display:flex;
    justify-content:space-around;
    background:#fff;
    padding:15px;
    font-weight:bold;
}

/* PRODUCTS */
.products{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}
.product{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    transition:0.3s;
    cursor:pointer;
}
.product:hover{
    transform:translateY(-5px);
}
.product img{
    width:100%;
    height:200px;
    object-fit:cover;
    transition:0.4s;
}
.product:hover img{
    transform:scale(1.15); /* ZOOM */
}
.product-info{
    padding:10px;
}
.price{
    color:red;
    font-weight:bold;
}

/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
}
.popup img{
    max-width:80%;
}

/* FLOAT BUTTON */
.float-btn{
    position:fixed;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}
.float-btn img{
    width:30px;
}

/* RUNG */
@keyframes shake{
    0%{transform:rotate(0);}
    25%{transform:rotate(10deg);}
    50%{transform:rotate(-10deg);}
    75%{transform:rotate(10deg);}
    100%{transform:rotate(0);}
}

/* SÓNG */
.float-btn::before,
.float-btn::after{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:rgba(0,123,255,0.4);
    animation:ripple 1.5s infinite;
}
.float-btn::after{
    animation-delay:0.5s;
}
@keyframes ripple{
    0%{transform:scale(1);opacity:0.8;}
    100%{transform:scale(2.5);opacity:0;}
}

/* POSITION */
.call{bottom:20px;left:20px;background:#007bff;animation:shake 1s infinite;}
.zalo{bottom:100px;left:20px;background:#00cfff;animation:shake 1s infinite;}
.messenger{bottom:180px;left:20px;background:#0084ff;animation:shake 1s infinite;}
.facebook{bottom:260px;left:20px;background:#1877f2;animation:shake 1s infinite;}

/* FOOTER */
.footer{
    background:#111;
    color:#fff;
    padding:30px;
}
.footer h3{
    margin-top:0;
}
.map{
    width:100%;
    height:300px;
    margin-top:10px;
    border:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>CÔNG TY CP TM & SX AN HƯNG</h1>
    <p>INOX AN HƯNG - GIA CÔNG THEO YÊU CẦU</p>
    <p>📞 0976 036 631</p>
</div>

<!-- SLIDER -->
<div class="slider">
    <div class="slides">
        <img src="BANNER.jpg">
        <img src="1.jpg">
        <img src="2.jpg">
    </div>

    <div class="cta">
        <a href="tel:0976036631">📞 Gọi ngay</a>
        <a href="https://zalo.me/0976036631">Zalo</a>
    </div>
</div>

<!-- FEATURES -->
<div class="features">
    <div>🚚 Giao toàn quốc</div>
    <div>🏭 Gia công theo yêu cầu</div>
    <div>✅ Inox 304 cao cấp</div>
</div>

<!-- PRODUCTS -->
<div class="products">

<script>
for(let i=1;i<=18;i++){
document.write(`
<div class="product" onclick="showImg(this)">
    <img src="${i}.jpg">
    <div class="product-info">
        <h3>Nắp bể mẫu ${i}</h3>
        <p class="price">Liên hệ</p>
    </div>
</div>
`)
}
</script>

</div>

<!-- POPUP -->
<div class="popup" id="popup" onclick="closeImg()">
    <img id="popupImg">
</div>

<!-- FLOAT BUTTON -->
<a href="tel:0976036631" class="float-btn call">
    <img src="phone.png">
</a>

<a href="https://zalo.me/0976036631" class="float-btn zalo">
    <img src="zalo.png">
</a>

<a href="https://m.me/" class="float-btn messenger">
    <img src="messenger.png">
</a>

<a href="https://facebook.com/" class="float-btn facebook">
    <img src="facebook.png">
</a>

<!-- FOOTER -->
<div class="footer">
    <h3>CÔNG TY CP TM & SX AN HƯNG</h3>
    <p>Địa chỉ: Lô 10 KCN Tây Bắc Ga - P. Đông Thọ - TP Thanh Hóa</p>
    <p>Hotline: 0976 036 631</p>

    <iframe class="map"
    src="https://www.google.com/maps?q=19.8216857,105.7604043&hl=vi&z=16&output=embed">
    </iframe>
</div>

<script>
function showImg(el){
    document.getElementById("popup").style.display="flex";
    document.getElementById("popupImg").src = el.querySelector("img").src;
}
function closeImg(){
    document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
