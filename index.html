<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Nắp Bể Inox</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

/* BANNER */
.banner img{
    width:100%;
    height:250px;
    object-fit:cover;
}

/* MENU */
.menu{
    display:flex;
    gap:10px;
    padding:10px;
    background:#fff;
    overflow:auto;
}
.menu button{
    padding:8px 15px;
    border:none;
    background:#eee;
    border-radius:20px;
    cursor:pointer;
}
.menu button.active{
    background:red;
    color:#fff;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    padding:15px;
}

.product{
    background:#fff;
    border-radius:10px;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
}

.product img{
    width:100%;
    border-radius:8px;
}

.product p{
    font-weight:bold;
}

.price{
    color:red;
    font-size:18px;
    font-weight:bold;
}

.old{
    text-decoration:line-through;
    color:#888;
}

/* BUTTON */
.buy-btn{
    margin-top:auto;
    text-align:center;
    background:red;
    color:#fff;
    padding:10px;
    border-radius:6px;
    text-decoration:none;
    position:relative;
    z-index:2;
    animation:rung 1s infinite;
}

@keyframes rung{
    0%{transform:rotate(0)}
    25%{transform:rotate(5deg)}
    50%{transform:rotate(-5deg)}
    75%{transform:rotate(5deg)}
    100%{transform:rotate(0)}
}

/* SÓNG */
.buy-btn::after{
    content:'';
    position:absolute;
    inset:0;
    border:2px solid red;
    border-radius:6px;
    animation:song 1.5s infinite;
}

@keyframes song{
    0%{transform:scale(1);opacity:1}
    100%{transform:scale(1.5);opacity:0}
}

/* FLOAT ICON */
.float{
    position:fixed;
    right:15px;
    bottom:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.float a{
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
    animation:pulse 1.5s infinite;
}

.float img{
    width:30px;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.2)}
    100%{transform:scale(1)}
}
</style>
</head>

<body>

<!-- BANNER -->
<div class="banner">
<img src="BANNER.jpg">
</div>

<!-- MENU -->
<div class="menu">
<button onclick="filter('all')" class="active">Tất cả</button>
<button onclick="filter('500')">500</button>
<button onclick="filter('1000')">1000</button>
<button onclick="filter('2000')">2000</button>
</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- FLOAT ICON -->
<div class="float">
<a href="tel:0976036631"><img src="phone.png"></a>
<a href="#"><img src="zalo.png"></a>
<a href="#"><img src="messenger.png"></a>
<a href="#"><img src="facebook.png"></a>
</div>

<script>

// DATA (SỬA LINK GITHUB NẾU CẦN)
const data=[
{name:'Nắp bể 500x500',img:'2.jpg',price:1500000,old:2000000,type:'500'},
{name:'Nắp bể 600x600',img:'3.jpg',price:1700000,old:2200000,type:'1000'},
{name:'Nắp bể 700x700',img:'4.jpg',price:2000000,old:2600000,type:'2000'},
{name:'Nắp bể 800x800',img:'5.jpg',price:2300000,old:3000000,type:'2000'},
{name:'Nắp bể 900x900',img:'6.jpg',price:2600000,old:3400000,type:'2000'},
{name:'Nắp bể 1000x1000',img:'7.jpg',price:3000000,old:3800000,type:'2000'}
];

function render(list){
const html=list.map(p=>`
<div class="product">
<img src="${p.img}">
<p>${p.name}</p>
<div class="price">${p.price.toLocaleString()}đ</div>
<div class="old">${p.old.toLocaleString()}đ</div>
<a href="tel:0976036631" class="buy-btn">📞 GỌI NGAY</a>
</div>
`).join('');

document.getElementById('products').innerHTML=html;
}

function filter(type){
document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');

if(type==='all') return render(data);
render(data.filter(p=>p.type===type));
}

render(data);

</script>

</body>
</html>
