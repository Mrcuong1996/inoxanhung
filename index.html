<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header Inox An Hưng</title>

<style>

/* ===== BASE ===== */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
padding-top:70px; /* tránh bị header che */
background:#111;
}

/* ===== HEADER ===== */
.header{
position:fixed;
top:0;
left:0;
width:100%;
background:#000;
border-bottom:1px solid #d4af37;
z-index:999;
}

.header-inner{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
}

/* LOGO */
.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
color:#d4af37;
font-weight:bold;
}

.logo img{
height:38px;
width:auto;
}

/* MENU */
.nav{
display:flex;
gap:18px;
}

.nav a{
color:#fff;
text-decoration:none;
font-size:14px;
transition:.2s;
}

.nav a:hover{
color:#d4af37;
}

/* HOTLINE */
.hotline{
background:#d4af37;
color:#111;
padding:8px 14px;
border-radius:20px;
font-weight:bold;
text-decoration:none;
white-space:nowrap;
}

/* MOBILE */
@media(max-width:768px){
.nav{display:none;}
.logo span{font-size:14px;}
.hotline{padding:6px 10px;font-size:13px;}
.logo img{height:32px;} /* FIX logo nhỏ lại trên mobile */
}

</style>
</head>

<body>

<!-- ===== HEADER START ===== -->
<header class="header">

  <div class="header-inner">

    <!-- LOGO (click về home) -->
    <a href="./" class="logo">
      <img src="logo.png" alt="Inox An Hưng">
      <span>INOX AN HƯNG</span>
    </a>

    <!-- MENU -->
    <nav class="nav">
      <a href="#gioithieu">Giới thiệu</a>
      <a href="#sanpham">Sản phẩm</a>
      <a href="#congtrinh">Công trình</a>
      <a href="#baogia">Báo giá</a>
      <a href="#lienhe">Liên hệ</a>
    </nav>

    <!-- HOTLINE -->
    <a href="tel:0976036631" class="hotline">
      📞 0976 036 631
    </a>

  </div>

</header>
<!-- ===== HEADER END ===== -->

<!-- ===== HERO SECTION sẽ đặt ở đây ===== -->
<!--
<section class="hero">
   HERO SECTION của bạn sẽ đặt ngay dưới header này
-->
<!-- ===== HERO SECTION START ===== -->

<style>

/* ===== HERO ===== */
.hero{
height:90vh;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url('BANNER.jpg');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#fff;
}

.hero-inner{
max-width:900px;
padding:20px;
}

.hero h1{
font-size:42px;
color:#d4af37;
margin-bottom:15px;
}

.hero p{
font-size:18px;
color:#ddd;
margin-bottom:25px;
line-height:1.6;
}

/* BUTTON */
.hero-btns{
display:flex;
gap:12px;
justify-content:center;
flex-wrap:wrap;
}

.btn{
padding:12px 20px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
transition:.2s;
}

.btn-gold{
background:#d4af37;
color:#111;
}

.btn-outline{
border:2px solid #d4af37;
color:#d4af37;
}

.btn:hover{
transform:translateY(-2px);
}

/* MOBILE */
@media(max-width:768px){
.hero h1{font-size:26px;}
.hero p{font-size:15px;}
}

</style>

<section class="hero">

  <div class="hero-inner">

    <h1>GIA CÔNG INOX THEO YÊU CẦU</h1>

    <p>
      Nắp bể inox • Nhà Bếp inox • Cầu thang inox • Máng xối inox  
      <br>
      Giá xưởng - Thi công tận nơi - Bảo hành rõ ràng
    </p>

    <div class="hero-btns">

      <a href="tel:0976036631" class="btn btn-gold">
        📞 GỌI NGAY
      </a>

    </div>

  </div>

</section>

<!-- ===== HERO SECTION END ===== -->
  
</body>
</html>
