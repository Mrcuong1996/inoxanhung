<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showroom Nắp Bể Âm Sàn</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#f5f5f5;
}

/* HEADER */
.header {
    background:#d40000;
    color:#fff;
    padding:15px;
    text-align:center;
    font-weight:bold;
}

/* BANNER */
.hero {
    background: url('BANNER.jpg') center/cover;
    height:320px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    text-align:center;
}

.hero h1 {
    background:rgba(0,0,0,0.6);
    padding:15px;
}

/* PRODUCTS */
.products {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.product {
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    transition:0.3s;
}

.product:hover {
    transform:translateY(-5px);
}

.product img {
    width:100%;
    height:200px;
    object-fit:cover;
}

.product-info {
    padding:10px;
}

.price {
    color:red;
    font-weight:bold;
}

/* FLOAT BUTTON CHUNG */
.float-btn {
    position:fixed;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

/* ICON IMG */
.float-btn img {
    width:30px;
}

/* HIỆU ỨNG RUNG */
@keyframes shake {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(10deg); }
    50% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
}

/* SÓNG LAN */
.float-btn::before,
.float-btn::after {
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:rgba(0, 123, 255, 0.4);
    animation:ripple 1.5s infinite;
    z-index:-1;
}

.float-btn::after {
    animation-delay:0.5s;
}

@keyframes ripple {
    0% { transform:scale(1); opacity:0.8; }
    100% { transform:scale(2.5); opacity:0; }
}

/* CALL */
.call {
    bottom:20px;
    left:20px;
    background:#007bff;
    animation:shake 1s infinite;
}

/* ZALO */
.zalo {
    bottom:100px;
    left:20px;
    background:#00cfff;
    animation:shake 1s infinite;
}

/* MESSENGER */
.messenger {
    bottom:180px;
    left:20px;
    background:#0084ff;
    animation:shake 1s infinite;
}

/* FACEBOOK */
.facebook {
    bottom:260px;
    left:20px;
    background:#1877f2;
    animation:shake 1s infinite;
}

/* FOOTER */
.footer {
    background:#d40000;
    color:#fff;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<div class="header">
WALPRO STORE - NẮP BỂ ÂM SÀN INOX 304
</div>

<div class="hero">
    <h1>Phân phối nắp bể âm sàn cao cấp</h1>
</div>

<div class="products">

    <div class="product">
        <img src="1.jpg">
        <div class="product-info">
            <h3>Nắp bể 50x50</h3>
            <p class="price">1.590.000đ</p>
        </div>
    </div>

    <div class="product">
        <img src="2.jpg">
        <div class="product-info">
            <h3>Nắp bể 60x60</h3>
            <p class="price">2.070.000đ</p>
        </div>
    </div>

    <div class="product">
        <img src="3.jpg">
        <div class="product-info">
            <h3>Nắp bể 70x70</h3>
            <p class="price">2.550.000đ</p>
        </div>
    </div>

</div>

<!-- FLOAT BUTTONS -->

<a href="tel:0976529518" class="float-btn call">
    <img src="phone.png">
</a>

<a href="#" class="float-btn zalo">
    <img src="zalo.png">
</a>

<a href="#" class="float-btn messenger">
    <img src="messenger.png">
</a>

<a href="#" class="float-btn facebook">
    <img src="facebook.png">
</a>

<div class="footer">
Hotline: 0976.529.518
</div>

</body>
</html>
