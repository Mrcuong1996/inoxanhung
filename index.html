<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Showroom Nắp Bể Âm Sàn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* HEADER */
        .header {
            background: #d40000;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        /* HERO BANNER */
        .hero {
            background: url('https://images.unsplash.com/photo-1581090700227-1e8c6bfa0a1c') center/cover;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            background: rgba(0,0,0,0.5);
            padding: 15px;
        }

        /* CTA */
        .cta {
            margin-top: 10px;
        }

        .cta a {
            background: orange;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            margin: 5px;
            display: inline-block;
            border-radius: 5px;
        }

        /* FEATURE */
        .features {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 15px;
        }

        .feature {
            text-align: center;
            font-size: 14px;
        }

        /* PRODUCT GRID */
        .products {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 10px;
        }

        .price {
            color: red;
            font-weight: bold;
        }

        /* FOOTER */
        .footer {
            background: #d40000;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        /* FLOAT BUTTON */
        .call-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #007bff;
            color: white;
            padding: 15px;
            border-radius: 50%;
            text-decoration: none;
            font-size: 18px;
        }

    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        WALPRO STORE - NẮP BỂ ÂM SÀN INOX 304
    </div>

    <!-- HERO -->
    <div class="hero">
        <div>
            <h1>Phân phối nắp bể âm sàn cao cấp</h1>
            <div class="cta">
                <a href="tel:0976036631">📞 Gọi ngay</a>
                <a href="#">Mua ngay</a>
            </div>
        </div>
    </div>

    <!-- FEATURES -->
    <div class="features">
        <div class="feature">🚚 Giao hàng toàn quốc</div>
        <div class="feature">✅ Inox 304 cao cấp</div>
        <div class="feature">🔧 Bảo hành dài hạn</div>
    </div>

    <!-- PRODUCTS -->
    <div class="products">

        <!-- PRODUCT 1 -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
            <div class="product-info">
                <h3>Nắp bể 50x50</h3>
                <p class="price">1.590.000đ</p>
            </div>
        </div>

        <!-- PRODUCT 2 -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1582582429416-2b6c3bda8d3d">
            <div class="product-info">
                <h3>Nắp bể 60x60</h3>
                <p class="price">2.070.000đ</p>
            </div>
        </div>

        <!-- PRODUCT 3 -->
        <div class="product">
            <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952">
            <div class="product-info">
                <h3>Nắp bể 70x70</h3>
                <p class="price">2.550.000đ</p>
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>Địa chỉ: Vinhomes Ocean Park 3</p>
        <p>Hotline: 0976.036.631</p>
    </div>

    <!-- FLOAT CALL -->
    <a href="tel:0976529518" class="call-btn">📞</a>

</body>
</html>
