<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nắp bể inox</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f5f5f5;
}

/* GRID */
.products{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    padding:15px;
}

/* CARD */
.product{
    background:#fff;
    border-radius:10px;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
}

.product img{
    width:100%;
    border-radius:8px;
}

.product p{
    font-weight:bold;
    margin:8px 0;
}

/* GIÁ */
.price{
    color:red;
    font-size:18px;
    font-weight:bold;
}

.old-price{
    text-decoration:line-through;
    color:#888;
    font-size:14px;
}

/* NÚT GỌI */
.buy-btn{
    margin-top:auto;
    text-align:center;
    background:red;
    color:#fff;
    padding:10px;
    border-radius:6px;
    text-decoration:none;
    font-weight:bold;
    position:relative;
    z-index:2;
}

/* HIỆU ỨNG RUNG */
@keyframes rung{
    0%{transform:rotate(0)}
    25%{transform:rotate(5deg)}
    50%{transform:rotate(-5deg)}
    75%{transform:rotate(5deg)}
    100%{transform:rotate(0)}
}

.buy-btn{
    animation:rung 1s infinite;
}

/* SÓNG */
.buy-btn::after{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    border-radius:6px;
    border:2px solid red;
    animation:song 1.5s infinite;
}

@keyframes song{
    0%{transform:scale(1);opacity:1}
    100%{transform:scale(1.5);opacity:0}
}
</style>
</head>

<body>

<div class="products" id="products"></div>

<script>
// DATA
const data=[
{name:'Nắp bể 500x500',img:'2.jpg',price:1500000,old:2000000},
{name:'Nắp bể 600x600',img:'3.jpg',price:1700000,old:2200000},
{name:'Nắp bể 700x700',img:'4.jpg',price:2000000,old:2600000},
{name:'Nắp bể 800x800',img:'5.jpg',price:2300000,old:3000000},
{name:'Nắp bể 900x900',img:'6.jpg',price:2600000,old:3400000},
{name:'Nắp bể 1000x1000',img:'7.jpg',price:3000000,old:3800000}
];

// RENDER
function render(){
const html=data.map(p=>`
<div class="product">

<img src="${p.img}" alt="">

<p>${p.name}</p>

<div class="price">${p.price.toLocaleString()}đ</div>
<div class="old-price">${p.old.toLocaleString()}đ</div>

<a href="tel:0976036631" class="buy-btn">
📞 GỌI NGAY
</a>

</div>
`).join('');

document.getElementById('products').innerHTML=html;
}

render();
</script>

</body>
</html>
