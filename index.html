<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inox An Hưng</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

/* HEADER */
header{
    background:#0c2d57;
    color:#fff;
    padding:15px;
    text-align:center;
}

/* BANNER */
.banner img{
    width:100%;
    height:300px;
    object-fit:cover;
}

/* PRODUCTS */
.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.product{
    background:#fff;
    padding:10px;
    border-radius:10px;
    position:relative;
    display:flex;
    flex-direction:column;
    transition:0.3s;
}

.product:hover{
    transform:translateY(-5px);
}

.product img{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:8px;
}

.product p{
    font-weight:bold;
    margin:10px 0;
}

.price{
    color:red;
    font-weight:bold;
}

.old{
    text-decoration:line-through;
    color:#888;
    font-size:13px;
}

.buy{
    margin-top:auto;
    background:#ff6600;
    color:#fff;
    padding:10px;
    text-align:center;
    border-radius:6px;
    text-decoration:none;
    animation:shake 1s infinite;
}

/* rung */
@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-2px)}
    50%{transform:translateX(2px)}
    75%{transform:translateX(-2px)}
    100%{transform:translateX(0)}
}

/* ICON FIX */
.fixed{
    position:fixed;
    right:20px;
    bottom:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.fixed img{
    width:50px;
    height:50px;
    border-radius:50%;
    animation:wave 1.5s infinite;
}

@keyframes wave{
    0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}
    70%{box-shadow:0 0 0 15px rgba(255,0,0,0)}
    100%{box-shadow:0 0 0 0 rgba(255,0,0,0)}
}

/* FOOTER */
footer{
    background:#0c2d57;
    color:#fff;
    padding:20px;
    text-align:center;
    margin-top:30px;
}

iframe{
    width:100%;
    height:250px;
    border:0;
}
</style>
</head>

<body>

<header>
<h2>CÔNG TY CP TM & SX INOX AN HƯNG</h2>
<p>Gia công inox theo yêu cầu - 0976036631</p>
</header>

<div class="banner">
<img src="BANNER.jpg">
</div>

<div class="container">
<div class="products" id="products"></div>
</div>

<footer>
<p>Địa chỉ: Lô 10 KCN Tây Bắc Ga - Đông Thọ - TP Thanh Hóa</p>

<iframe src="https://www.google.com/maps?q=19.8216857,105.7604043&output=embed"></iframe>
</footer>

<!-- ICON -->
<div class="fixed">
<a href="tel:0976036631"><img src="phone.png"></a>
<a href="#"><img src="zalo.png"></a>
<a href="#"><img src="messenger.png"></a>
<a href="#"><img src="facebook.png"></a>
</div>

<script>
const data=[
{name:'Nắp bể 500x500',img:'1.jpg',price:1500000,old:2000000},
{name:'Nắp bể 600x600',img:'2.jpg',price:1700000,old:2200000},
{name:'Nắp bể 700x700',img:'3.jpg',price:2000000,old:2600000},
{name:'Nắp bể 800x800',img:'4.jpg',price:2300000,old:3000000},
{name:'Nắp bể 900x900',img:'5.jpg',price:2600000,old:3400000},
{name:'Nắp bể 1000x1000',img:'6.jpg',price:3000000,old:3800000},
{name:'Nắp inox',img:'7.jpg',price:1500000,old:2000000},
{name:'Bể nước ngầm',img:'8.jpg',price:2000000,old:2600000},
{name:'Tủ inox',img:'9.jpg',price:3000000,old:3800000}
];

function render(){
let html='';
data.forEach(p=>{
html+=`
<div class="product">
<img src="${p.img}">
<p>${p.name}</p> 
<div class="price">${p.price.toLocaleString()}đ</div>
<div class="old">${p.old.toLocaleString()}đ</div>
<a href="tel:0976036631" class="buy">📞 GỌI NGAY</a>
</div>
`;
});
document.getElementById('products').innerHTML=html;
}

render();
</script>

</body>
</html>
