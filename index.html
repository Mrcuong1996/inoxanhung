<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nắp Bể Inox An Hưng | Gia Công Inox Thanh Hóa</title>

<meta name="description" content="Công ty CP TM & SX An Hưng chuyên sản xuất nắp bể inox, lan can inox, cầu thang inox, máng xối inox tại Thanh Hóa.">
<meta name="keywords" content="inox thanh hóa, nắp bể inox, lan can inox, cầu thang inox">
<meta name="robots" content="index, follow">

<link rel="icon" href="logo.png">

<style>

/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{
background:#111;
color:#fff;
padding-top:85px;
overflow-x:hidden;
scroll-behavior:smooth;
}

/* ================= HEADER ================= */
header{
position:fixed;
top:0;left:0;
width:100%;
background:#000;
border-bottom:1px solid #d4af37;
z-index:999;
}

.container{width:95%;max-width:1200px;margin:auto;}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 0;
}

.logo{
display:flex;
align-items:center;
gap:10px;
text-decoration:none;
}

.logo img{height:42px;}

.logo h1{
font-size:18px;
color:#d4af37;
}

nav a{
color:#fff;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

nav a:hover{color:#d4af37;}

.hotline{
background:#d4af37;
color:#111;
padding:8px 15px;
border-radius:20px;
font-weight:bold;
}

/* ================= HERO ================= */
.hero{
height:90vh;
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url('BANNER.jpg');
background-size:cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h2{font-size:40px;color:#d4af37;}
.hero p{margin:20px 0;font-size:18px;}

.btn{
padding:12px 20px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

.btn-gold{background:#d4af37;color:#111;}
.btn-outline{border:2px solid #d4af37;color:#d4af37;}

/* ================= SECTION ================= */
section{padding:70px 0;}

.section-title{text-align:center;margin-bottom:30px;}
.section-title h2{color:#d4af37;font-size:30px;}

/* ================= PRODUCTS ================= */
.product-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

.product{
background:#1a1a1a;
border-radius:12px;
overflow:hidden;
position:relative;
}

.product img{width:100%;height:200px;object-fit:cover;}

.product-content{padding:15px;text-align:center;}

.price{color:#d4af37;font-size:18px;font-weight:bold;}

.buy-btn{
display:inline-block;
margin-top:10px;
background:#d4af37;
color:#111;
padding:8px 15px;
border-radius:20px;
text-decoration:none;
}

/* ================= FLOAT ICON ================= */
.contact-float{
position:fixed;
right:20px;
bottom:80px;
display:flex;
flex-direction:column;
gap:12px;
z-index:9999;
}

.cf-item{
width:55px;height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-size:20px;
text-decoration:none;
position:relative;
animation:shake 1.8s infinite;
box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.phone{background:#e74c3c;}
.zalo{background:#0084ff;}
.messenger{background:#1877f2;}

@keyframes shake{
0%{transform:rotate(0);}
25%{transform:rotate(4deg);}
50%{transform:rotate(0);}
75%{transform:rotate(-4deg);}
100%{transform:rotate(0);}
}

.pulse{
position:absolute;
width:100%;height:100%;
border-radius:50%;
background:inherit;
animation:pulse 2s infinite;
z-index:-1;
}

@keyframes pulse{
0%{transform:scale(1);opacity:.6;}
100%{transform:scale(2.5);opacity:0;}
}

/* ================= FORM ================= */
.form-box{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

input,textarea{
width:100%;
padding:10px;
margin-bottom:10px;
}

/* ================= FOOTER ================= */
footer{
background:#000;
padding:40px 0;
text-align:center;
color:#aaa;
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header>
<div class="container navbar">

<a href="./" class="logo">
<img src="logo.png">
<h1>INOX AN HƯNG</h1>
</a>

<nav>
<a href="#sanpham">Sản phẩm</a>
<a href="#baogia">Báo giá</a>
<a href="#lienhe">Liên hệ</a>
</nav>

<a href="tel:0976036631" class="hotline">📞 Gọi ngay</a>

</div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
<div>
<h2>GIA CÔNG INOX THANH HÓA</h2>
<p>Nắp bể inox - Lan can - Cầu thang - Máng xối</p>
<a href="tel:0976036631" class="btn btn-gold">GỌI NGAY</a>
<a href="#baogia" class="btn btn-outline">BÁO GIÁ</a>
</div>
</section>

<!-- ================= PRODUCTS ================= -->
<section id="sanpham">
<div class="container">
<div class="section-title">
<h2>SẢN PHẨM</h2>
</div>

<div class="product-grid" id="products"></div>
</div>
</section>

<!-- ================= FORM ================= -->
<section id="baogia">
<div class="container">

<div class="section-title">
<h2>YÊU CẦU BÁO GIÁ</h2>
</div>

<div class="form-box">

<div>
<h3>Thông tin liên hệ</h3>
<p>📍 Thanh Hóa</p>
<p>📞 0976036631</p>
</div>

<div>
<input placeholder="Họ tên">
<input placeholder="SĐT">
<textarea placeholder="Nội dung"></textarea>
<button class="buy-btn">GỬI YÊU CẦU</button>
</div>

</div>

</div>
</section>

<!-- ================= FOOTER ================= -->
<footer id="lienhe">
© 2026 Inox An Hưng - Thanh Hóa
</footer>

<!-- ================= FLOAT ICON ================= -->
<div class="contact-float">

<a href="tel:0976036631" class="cf-item phone">
📞<span class="pulse"></span>
</a>

<a href="https://zalo.me/4076776927681495659" class="cf-item zalo">
Z<span class="pulse"></span>
</a>

<a href="https://www.facebook.com/inoxanhungthanhhoa/" class="cf-item messenger">
M<span class="pulse"></span>
</a>

</div>

<!-- ================= JS ================= -->
<script>

const products=[
{name:"Nắp bể 500x500",price:1215000,img:"500.png"},
{name:"Nắp bể 600x600",price:1395000,img:"600.png"},
{name:"Lan can inox",price:0,img:"11.jpg"},
];

let html="";

products.forEach(p=>{
html+=`
<div class="product">
<img src="${p.img}">
<div class="product-content">
<h3>${p.name}</h3>
<div class="price">
${p.price>0?p.price.toLocaleString()+"đ":"Liên hệ"}
</div>
<a href="tel:0976036631" class="buy-btn">GỌI NGAY</a>
</div>
</div>
`;
});

document.getElementById("products").innerHTML=html;

</script>

</body>
</html>
