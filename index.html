<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inox An Hưng</title>

<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.container{max-width:1200px;margin:auto}

.header{background:#c40000;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}

/* banner */
.banner{max-width:1200px;margin:10px auto}
.banner img{width:100%;border-radius:10px}

/* sản phẩm */
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:20px;
}

.product{
  background:#fff;
  padding:10px;
  border-radius:10px;
  text-align:center;
  position:relative;
  transition:.3s;
}

.product:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(0,0,0,.2)
}

.product img{width:100%}

.discount{
  position:absolute;
  top:10px;
  right:10px;
  background:red;
  color:#fff;
  padding:5px;
  border-radius:50%;
  font-size:12px
}

.price{color:red;font-weight:bold}
.old-price{text-decoration:line-through;color:gray}

.buy-btn{
  margin-top:10px;
  background:#ff6600;
  border:none;
  padding:10px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  border-radius:5px
}

/* tiêu đề phân đoạn */
.section-title{
  grid-column:1/-1;
  text-align:center;
  margin:40px 0 20px;
  position:relative;
}

.section-title span{
  background:#f5f5f5;
  padding:10px 20px;
  font-size:18px;
  font-weight:bold;
  color:#c40000;
  position:relative;
  z-index:2;
}

.section-title::before{
  content:'';
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:2px;
  background:#ddd;
  z-index:1;
}

/* ICON SOCIAL */
.social{
  position:fixed;
  right:20px;
  top:40%;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.icon{
  position:relative;
  display:flex;
  align-items:center;
}

.icon img{
  width:45px;
  height:45px;
  border-radius:50%;
}

/* text hover */
.icon span{
  position:absolute;
  right:55px;
  background:#000;
  color:#fff;
  padding:6px 10px;
  border-radius:5px;
  white-space:nowrap;
  opacity:0;
  transform:translateX(10px);
  transition:.3s;
  font-size:13px;
}

/* hover */
.icon:hover span{
  opacity:1;
  transform:translateX(0);
}

/* màu từng icon */
.icon:nth-child(1) span{background:red;}
.icon:nth-child(2) span{background:#0aa545;}
.icon:nth-child(3) span{background:#0084ff;}
.icon:nth-child(4) span{background:#1877f2;}

.icon span::after{
  content:'';
  position:absolute;
  right:-5px;
  top:50%;
  transform:translateY(-50%);
  border:5px solid transparent;
  border-left-color:inherit;
}

/* footer */
.footer-top{
  background:#c40000;
  color:#fff;
  display:flex;
  justify-content:space-around;
  padding:15px;
  font-weight:bold;
  flex-wrap:wrap;
  text-align:center
}

.footer{background:#eee;padding:30px}
.footer-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px
}

.footer h4{color:#0b4aa2}
.map iframe{width:100%;height:250px;border:0}

</style>
</head>

<body>

<div class="header">CÔNG TY CỔ PHẦN TM & SX AN HƯNG</div>

<div class="banner">
<img src="BANNER.jpg">
</div>

<div class="container">
<div class="product-grid" id="products"></div>
</div>

<!-- ICON -->
<div class="social">
  <a href="tel:0976036631" class="icon">
    <img src="phone.png">
    <span>GỌI NGAY</span>
  </a>

  <a href="#" class="icon">
    <img src="zalo.png">
    <span>CHAT ZALO</span>
  </a>

  <a href="#" class="icon">
    <img src="messenger.png">
    <span>NHẮN TIN</span>
  </a>

  <a href="#" class="icon">
    <img src="facebook.png">
    <span>FACEBOOK</span>
  </a>
</div>

<div class="footer-top">
<div>HOTLINE: 0976036631</div>
<div>GIA CÔNG INOX THEO YÊU CẦU</div>
<div>UY TÍN - CHẤT LƯỢNG</div>
</div>

<div class="footer">
<div class="footer-grid">

<div>
<h4>THÔNG TIN CÔNG TY</h4>
<p>Công ty CP TM & SX An Hưng</p>
<p>Thanh Hóa</p>
<p>0976036631</p>
</div>

<div>
<h4>DỊCH VỤ</h4>
<p>Gia công inox</p>
<p>Nắp bể inox</p>
<p>Theo yêu cầu</p>
</div>

<div class="map">
<h4>BẢN ĐỒ</h4>
<iframe src="https://www.google.com/maps?q=19.8216857,105.7604043&z=16&output=embed"></iframe>
</div>

</div>
</div>

<script>
const data=[
{name:'Nắp bể 500x500',img:'500.png',price:1215000,old:1350000,type:'500'},
{name:'Nắp bể 600x600',img:'600.png',price:1395000,old:1550000,type:'500'},
{name:'Nắp bể 700x700',img:'700.png',price:1611000,old:1790000,type:'500'},
{name:'Nắp bể 800x800',img:'800.png',price:1935000,old:2150000,type:'500'},
{name:'Nắp bể 900x900',img:'900.png',price:2160000,old:2400000,type:'500'},
{name:'Nắp bể 1000x1000',img:'1000.png',price:2610000,old:2900000,type:'500'},

{name:'Nắp bể 500x500',img:'8.jpg',price:1800000,old:1900000,type:'1000'},
{name:'Nắp bể 600x600',img:'9.jpg',price:2025000,old:2250000,type:'1000'},
{name:'Nắp bể 700x700',img:'10.jpg',price:2385000,old:2650000,type:'1000'},
{name:'Nắp bể 800x800',img:'11.jpg',price:2745000,old:3050000,type:'1000'},
{name:'Nắp bể 900x900',img:'12.jpg',price:2970000,old:3300000,type:'1000'},
{name:'Nắp bể 1000x1000',img:'13.jpg',price:3591000,old:3990000,type:'1000'}
];

function productHTML(p){
return `<div class="product">
<div class="discount">-10%</div>
<img src="${p.img}">
<p>${p.name}</p>
<div class="price">${p.price.toLocaleString()}đ</div>
<div class="old-price">${p.old.toLocaleString()}đ</div>
<button class="buy-btn" onclick="callNow()">GỌI NGAY</button>
</div>`;
}

function render(){
const group500 = data.filter(p=>p.type==='500');
const group1000 = data.filter(p=>p.type==='1000');

const html500 = group500.map(productHTML).join('');
const html1000 = group1000.map(productHTML).join('');

document.getElementById('products').innerHTML =
`<div class="section-title"><span>NẮP BỂ 500KG</span></div>` +
html500 +
`<div class="section-title"><span>NẮP BỂ 1000KG</span></div>` +
html1000;
}

function callNow(){
window.location.href='tel:0976036631';
}

render();
</script>

</body>
</html>
